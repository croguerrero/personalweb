name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install tsc --noEmit
      - run: npm run build
      - name: Save build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan npm lockfile
        run: |
          docker run --rm --mount "type=bind,source=${GITHUB_WORKSPACE},target=/src,readonly" \
            ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source --lockfile=/src/package-lock.json

  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep CE
        run: pipx install 'semgrep==1.187.0'
      - name: Scan source code
        run: semgrep scan --config p/default --metrics off --strict --error .

  deploy:
    name: Deploy to AWS (OIDC)
    needs: [build, sca, sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portfolio-dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: portfolio-${{ github.run_id }}
      - name: Publish to S3 and invalidate CloudFront
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUCKET_URI: s3://slopeit-bucket-webpage-prod
          DISTRIBUTION_ID: EDPPV9B86HA6P
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping deployment of a commit that is no longer at the head of main."
            exit 0
          fi

          test -f dist/index.html
          test -d dist/assets
          aws s3 cp dist/assets/ "$BUCKET_URI/assets/" --recursive \
            --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          aws s3 cp dist/ "$BUCKET_URI/" --recursive --exclude 'assets/*' \
            --exclude 'index.html' --cache-control 'public, max-age=3600' --only-show-errors
          aws s3 cp dist/index.html "$BUCKET_URI/index.html" \
            --cache-control 'no-cache' --content-type 'text/html; charset=utf-8' --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text
